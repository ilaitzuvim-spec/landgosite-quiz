<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>טופס פרטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap">
<style>
html,body{margin:0;padding:0;background:transparent;direction:rtl;font-family:Rubik,Arial,sans-serif;color:#1d1d1f}
form{max-width:100%!important;width:100%!important}
form{display:flex!important;flex-direction:column!important;gap:14px!important}
label{font:500 15px Rubik,Arial,sans-serif!important;color:#1d1d1f!important}
input[type=text],input[type=email],input[type=tel],input:not([type]){width:100%!important;height:auto!important;box-sizing:border-box!important;font:17px Rubik,Arial,sans-serif!important;color:#1d1d1f!important;background:#fff!important;border:1.5px solid #d2d2d7!important;border-radius:14px!important;padding:14px 14px!important;min-height:52px!important;text-align:right!important;outline:none!important}
input[type=hidden]{display:none!important}
input::placeholder{color:#6e6e76!important;opacity:1!important}
input:focus{border-color:#0058b3!important;box-shadow:0 0 0 4px rgba(0,88,179,.15)!important}
input[type=submit],button{width:100%!important;height:auto!important;font:600 18px Rubik,Arial,sans-serif!important;color:#fff!important;background:linear-gradient(100deg,#0058b3,#00796b)!important;border:0!important;border-radius:980px!important;padding:15px 24px!important;min-height:56px!important;cursor:pointer!important}
</style>
</head>
<body>
<!-- טופס רב מסר: "שאלון אבחון - לקוחות מהשאלון", רשימה "לקוחות מהשאלון" -->
<script type="text/javascript" src="https://form2.ravpage.co.il/cc272e90653acff34f69a57219a05eff6ACCE2B8" charset="UTF-8"></script>
<script>
setInterval(function(){var s={};document.querySelectorAll('input[type=submit],button').forEach(function(b){var k=(b.value||b.textContent||'').trim();if(s[k])b.style.display='none';else s[k]=1})},400);
</script>
</body>
</html>
